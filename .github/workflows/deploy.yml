# The app, live: every merge to main is built, tested and deployed to
# Firebase Hosting. Only main reaches the `production` environment, which
# holds nothing a branch can use. The deploy key is the secret that
# `firebase init hosting:github` made (named for the project), or one named
# FIREBASE_SERVICE_ACCOUNT.
name: Deploy
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check the settings are in
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          # A build without them would ship an app that says the database isn't connected
          for name in SUPABASE_URL SUPABASE_KEY PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::A GitHub variable is empty: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and FIREBASE_PROJECT_ID (Settings › Secrets and variables › Actions › Variables; docs/MORNING.md, step 8)"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_HICKS_APP_1B1A5 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
