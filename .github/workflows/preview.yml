# Every change is a branch with a draft pull request (CLAUDE.md, "Branches,
# previews and merging"). For each one, drafts included, while it's being
# worked on: the branch's name is checked, then the app is built, tested, and put on its own Firebase Hosting
# preview channel. The link is posted on the pull request and lives 7 days.
# Docs-only changes don't build. A new push cancels the build in progress.
name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  preview:
    # Pull requests from forks never get the deploy key
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Every branch is named for its work (CLAUDE.md, "Branches, previews and merging")
      - name: Check the branch's name
        run: node scripts/check-branch.mjs
        env:
          BRANCH: ${{ github.head_ref }}
      # A wrong value here is built into the app for good (scripts/check-settings.mjs)
      - name: Check the settings are right
        run: node scripts/check-settings.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_HICKS_APP_1B1A5 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
