# A preview of the app for every pull request, drafts included, while it's
# being worked on: built, tested, and put on its own Firebase Hosting
# preview channel. The link is posted on the pull request and lives 7 days.
# Docs-only changes don't build. A new push cancels the build in progress.
name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  preview:
    # Pull requests from forks never get the deploy key
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the settings are in
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          # A build without them would ship an app that says the database isn't connected
          for name in SUPABASE_URL SUPABASE_KEY PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::A GitHub variable is empty: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY and FIREBASE_PROJECT_ID (Settings › Secrets and variables › Actions › Variables; docs/MORNING.md, step 8)"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_HICKS_APP_1B1A5 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
