# Laurie's birds, nightly: reads eBird's official API (no sign-in: eBird puts a bot
# check in front of a person's own pages) for checklists submitted under her display
# name, and brings the new ones into the Life List, only while a yes is recorded in
# the app. Runs only in the `ebird` environment, which only main may use. Once a
# night, a minute or two: well inside the Actions budget.
name: Sync Laurie's birds
on:
  schedule:
    - cron: '23 10 * * *'   # 10:23 UTC, in the small hours at home
  workflow_dispatch:
    inputs:
      discover:
        description: 'Look only: say in counts what the feed holds for her, save nothing'
        type: boolean
        default: false
      since:
        description: 'Fill in history from this date (YYYY-MM-DD); up to 400 days a run. Blank: the last 7 days'
        type: string
        default: ''
concurrency:
  group: sync-ebird
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ebird
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test -- tests/ebird-sync.test.mjs
      - run: node scripts/sync-ebird.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          EBIRD_DISPLAY_NAME: ${{ vars.EBIRD_DISPLAY_NAME }}
          DISCOVER: ${{ inputs.discover && '1' || '' }}
          SINCE: ${{ inputs.since }}
