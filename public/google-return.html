<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Team Hicks</title>
<style>html, body { margin: 0; min-height: 100vh; background: #FFF8EE; }</style>
</head>
<body>
<!--
  Google's sign-in comes back here (src/lib/google.js). The page shows nothing and reads no database: it keeps
  the hour's key Google sent, only if it answers the sign-in this device started (the state), and returns to the
  journal. It is its own page because the app's database client would take a key in the address for its own.
-->
<script>
(function () {
  var SCOPE = 'https://www.googleapis.com/auth/drive.file'
  var back = '/journal'
  try {
    var pending = JSON.parse(localStorage.getItem('teamhicks.google.pending') || 'null')
    localStorage.removeItem('teamhicks.google.pending')
    if (pending && typeof pending.back === 'string' && /^\/[a-z]/.test(pending.back) && pending.back.indexOf('//') !== 0) back = pending.back
    var q = new URLSearchParams(location.hash.replace(/^#/, ''))
    var scopes = (q.get('scope') || '').split(' ')
    if (pending && pending.state && q.get('state') === pending.state && q.get('access_token') && scopes.indexOf(SCOPE) >= 0) {
      var secs = Math.max(0, Math.min(3600, parseInt(q.get('expires_in') || '0', 10) || 0))
      localStorage.setItem('teamhicks.google', JSON.stringify({ token: q.get('access_token'), expires: Date.now() + secs * 1000 }))
    } else {
      localStorage.setItem('teamhicks.google.error', q.get('error') || 'no_match')
    }
  } catch (e) { /* nothing kept: the journal says so */ }
  location.replace(back)
})()
</script>
</body>
</html>
